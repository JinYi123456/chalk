<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Chalk — the open-weight AI that quotes the job before you leave the driveway">
  <defs>
    <radialGradient id="glow" cx="50%" cy="-10%" r="80%">
      <stop offset="0%" stop-color="#1b2029"/>
      <stop offset="60%" stop-color="#0e1015"/>
    </radialGradient>
    <linearGradient id="chalkline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b73f" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#f2b73f"/>
      <stop offset="100%" stop-color="#f2b73f" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" fill="url(#glow)"/>

  <!-- chalk dust: the job marked down before it goes cold -->
  <g opacity="0.16" fill="#f3f1ea">
    <circle cx="86" cy="352" r="2.5"/>
    <circle cx="132" cy="374" r="1.6"/>
    <circle cx="196" cy="347" r="2"/>
    <circle cx="268" cy="380" r="1.4"/>
    <circle cx="742" cy="366" r="2.2"/>
    <circle cx="806" cy="341" r="1.5"/>
    <circle cx="878" cy="372" r="2"/>
    <circle cx="928" cy="349" r="1.3"/>
  </g>

  <g transform="translate(72, 84)">
    <text x="0" y="0" fill="#f3f1ea" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="-2">Chalk</text>
    <rect x="4" y="26" width="286" height="4" rx="2" fill="url(#chalkline)"/>
    <text x="0" y="82" fill="#b9bcc4" font-family="'Segoe UI', system-ui, sans-serif" font-size="27">Quote the job before you leave the driveway.</text>
  </g>

  <!-- the decision, made visible: the same job at three different asks -->
  <g transform="translate(72, 268)" font-family="'Segoe UI', system-ui, sans-serif">
    <g>
      <rect x="0" y="0" width="252" height="84" rx="14" fill="#1a1e26" stroke="#333a49"/>
      <text x="20" y="34" fill="#f2b73f" font-size="30" font-weight="600" font-variant-numeric="tabular-nums">$388</text>
      <text x="20" y="62" fill="#7c828f" font-size="17">Win the job · 91%</text>
    </g>
    <g transform="translate(276, 0)">
      <rect x="0" y="0" width="252" height="84" rx="14" fill="#1a1e26" stroke="#f2b73f"/>
      <text x="20" y="34" fill="#f3f1ea" font-size="30" font-weight="600" font-variant-numeric="tabular-nums">$457</text>
      <text x="20" y="62" fill="#b9bcc4" font-size="17">Recommended · 67%</text>
    </g>
    <g transform="translate(552, 0)">
      <rect x="0" y="0" width="252" height="84" rx="14" fill="#1a1e26" stroke="#333a49"/>
      <text x="20" y="34" fill="#f2b73f" font-size="30" font-weight="600" font-variant-numeric="tabular-nums">$558</text>
      <text x="20" y="62" fill="#7c828f" font-size="17">Max · 35%</text>
    </g>
    <text x="0" y="120" fill="#7c828f" font-size="16">
      Priced in context over the pro's own job history by TabPFN-3.5 · photos read by open-weight vision · written by an open-weight model
    </text>
  </g>
</svg>
